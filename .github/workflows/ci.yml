name: Integração contínua

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependências fixadas
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Criar diretórios privados
        run: install -d -m 700 var var/backups var/static
      - name: Executar verificações e smoke local
        run: bash scripts/check.sh
      - name: Publicar relatórios de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
